<!-- Иконка GoliathChild:RE: старый жёсткий диск из завязки — тот, что приходит игроку в посылке с наклейкой «Не бойтесь».
     Бирюзовый свет из щели — отсылка к рабочему столу оригинала. Текст нарисован штрихами, а не шрифтом:
     импортёр SVG в Godot не гарантирует вывод текста. Векторная, чтобы Godot сам делал нужные размеры. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2226"/>
      <stop offset="1" stop-color="#05090b"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d969b"/>
      <stop offset="1" stop-color="#4c5459"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#33e1ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#33e1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Фон и свечение за диском. -->
  <rect width="256" height="256" rx="40" fill="url(#bg)"/>
  <circle cx="128" cy="132" r="118" fill="url(#glow)"/>

  <!-- Корпус диска, чуть повёрнут — «брошен на стол». -->
  <g transform="rotate(-8 128 128)">
    <rect x="44" y="34" width="168" height="196" rx="14" fill="url(#case)" stroke="#1d2326" stroke-width="5"/>
    <!-- Винты по углам. -->
    <circle cx="60" cy="50" r="6" fill="#2a3033"/>
    <circle cx="196" cy="50" r="6" fill="#2a3033"/>
    <circle cx="60" cy="214" r="6" fill="#2a3033"/>
    <circle cx="196" cy="214" r="6" fill="#2a3033"/>
    <!-- Выпуклость над пластиной. -->
    <circle cx="128" cy="100" r="54" fill="#6f787d" stroke="#3a4145" stroke-width="4"/>
    <circle cx="128" cy="100" r="14" fill="#2a3033"/>

    <!-- Наклейка: бумажная, с красной надписью от руки и строкой пароля. -->
    <rect x="62" y="156" width="132" height="58" rx="4" fill="#e9e2c8" stroke="#b8ae8a" stroke-width="2"/>
    <path d="M74 176 q6 -10 12 0 t12 0 t12 0 M118 168 v14 M126 176 q6 -10 12 0 t12 0 t12 0 t12 0"
          stroke="#c8202f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M74 198 h28 M108 198 h16 M130 198 h40" stroke="#2a3033" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Глитч-полосы, как в игре. -->
  <rect x="0" y="122" width="256" height="7" fill="#ff2a5f" opacity="0.6"/>
  <rect x="34" y="136" width="222" height="4" fill="#33e1ff" opacity="0.6"/>
</svg>
